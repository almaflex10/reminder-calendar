
spring:
  application:
    name: remindcalendar

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 60000
      keepalive-time: 0
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}


server:
  port: ${PORT:8080}
  error:
    include-message: always

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    validity-hours: 24

  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  verification-url: ${APP_VERIFICATION_URL:http://localhost:4200/verify}
  verification-token-validity-hours: 24
  registration-enabled: ${APP_REGISTRATION_ENABLED}
  mail:
    mode: ${APP_MAIL_MODE}
    from: ${APP_MAIL_FROM}
    from-name: Teendőnaptár
    brevo-api-key: ${BREVO_API_KEY:}