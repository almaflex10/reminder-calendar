# Netlify beállítások. A Netlify felületén a "Base directory" legyen: frontend
[build]
  command = "npm run build"
  publish = "dist/frontend/browser"

[build.environment]
  NODE_VERSION = "24"

# A service worker és a manifest mindig friss legyen, különben a telepített app nem veszi észre az új verziót.
[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
